# Every local service is a table with its own `name`, `domain` and
# `local_addr`. The `name` identifies it within the process and is what the
# administration API addresses; the `domain` is the `Host` it serves.
control_host = "control.example.com"
name = "home"
token = "use_a_secret_that_only_you_know"

[[proxies]]
name = "nas"
domain = "nas.example.com"
local_addr = "127.0.0.1:80"

[[proxies]]
# Every local service must have an explicit name.
name = "git"
domain = "git.example.com"
local_addr = "127.0.0.1:3000"
