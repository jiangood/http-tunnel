# The current format: every tunnel is a table with its own `name`, `domain` and
# `local_addr`. The `name` identifies the tunnel within the client and is what
# the administration API addresses; the `domain` is the `Host` it serves.
name = "home"
token = "use_a_secret_that_only_you_know"

[[tunnels]]
name = "nas"
domain = "nas.example.com"
local_addr = "127.0.0.1:80"

[[tunnels]]
# The name is optional: a tunnel declared without one is named after its domain
domain = "git.example.com"
local_addr = "127.0.0.1:3000"
