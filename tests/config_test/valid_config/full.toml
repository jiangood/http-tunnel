remote = "example.com:2333" # The address of the server
name = "home" # The name of the client
token = "use_a_secret_that_only_you_know" # The shared token of the server
api_port = 8610 # The port of the client administration API
heartbeat_timeout = 40 # The application-layer heartbeat timeout. Set to 0 to disable the test
retry_interval = 1 # The interval between retries to connect to the server
nodelay = true # Whether to enable TCP_NODELAY for the tunnels

[tunnels] # Each tunnel is a domain keyed to the `local_addr` of the local service
"nas.example.com" = "127.0.0.1:80" # Requests with this `Host` are forwarded to this address
"git.example.com" = "127.0.0.1:3000"
"www.example.com" = "127.0.0.1:80" # The same address can serve several domains
