[client]
remote_addr = "example.com:2333" # Necessary. The address of the server
default_token = "default_token_if_not_specify" # Optional. The default token of services, if they don't define their own ones

[client.services.service1] # A service that needs forwarding. The name `service1` can change arbitrarily, as long as identical to the name in the server's configuration
token = "whatever" # Necessary if `client.default_token` not set
local_addr = "127.0.0.1:1081" # Necessary. The address of the service that needs to be forwarded

[client.services.service2] # Multiple services can be defined
local_addr = "127.0.0.1:1082"

[server]
bind_addr = "0.0.0.0:2333" # Necessary. The address that the server listens for clients
http_bind_addr = "0.0.0.0:80" # Necessary. The HTTP entrypoint, routed by the `Host` header
default_token = "default_token_if_not_specify" # Optional

[server.services.service1] # The service name must be identical to the client side
token = "whatever" # Necessary if `server.default_token` not set
hosts = ["service1.example.com"] # Necessary. The hosts that are routed to this service

[server.services.service2]
hosts = ["service2.example.com", "www.service2.example.com"]
