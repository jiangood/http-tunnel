transport = "wss" # The WebSocket scheme: wss (TLS, default) or ws (plain text)
server_host = "control.example.com" # The control_host of the server
server_port = 443 # The http_port of the server
name = "home" # The name of the client
token = "use_a_secret_that_only_you_know" # The shared token of the server
web_port = 8610 # The port of the client web management interface
heartbeat_timeout = 40 # The application-layer heartbeat timeout. Set to 0 to disable the test
retry_interval = 1 # The interval between retries to connect to the server
nodelay = true # Whether to enable TCP_NODELAY for the tunnels

[[tunnels]] # Each tunnel is a table with its own name, domain and local_addr
name = "nas"
domain = "nas.example.com" # Requests with this `Host` are forwarded to `local_addr`
local_addr = "127.0.0.1:80"

[[tunnels]]
name = "git"
domain = "git.example.com"
local_addr = "127.0.0.1:3000"

[[tunnels]]
name = "www"
domain = "www.example.com" # The same address can serve several domains
local_addr = "127.0.0.1:80"
