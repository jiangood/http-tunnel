name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # buildx 默认会把构建记录(.dockerbuild)作为 artifact 上传,纯发布用不到
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  release:
    name: Cross build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Currently only publish Linux x86_64 (amd64), using musl for static binaries.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
            cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Native build
      - name: Install target
        if: matrix.cross == false
        run: rustup target add ${{ matrix.target }}
      # `ring` (through rustls) compiles C code, which needs a musl C compiler
      # when the cache is cold. Using `musl-gcc` for the target avoids depending
      # on a `x86_64-linux-musl-gcc` symlink that the runner does not provide.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Use musl-gcc for the musl target
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_x86_64_unknown_linux_musl=ar" >> "$GITHUB_ENV"
      - name: Run tests
        if: matrix.cross == false && matrix.target != 'aarch64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }} --verbose
      - name: Build release
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }}

      # Cross build
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Run tests
        if: matrix.cross
        run: cross test --release --target ${{ matrix.target }} --verbose --no-default-features --features node,management
      - name: Build release
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --no-default-features --features node,management

      - uses: actions/upload-artifact@v4
        with:
          name: http-tunnel-${{ matrix.name }}
          # artifact 只在同一次运行内被 docker job 下载使用,存 1 天足够,
          # 避免默认 90 天的保留期持续占用 Actions 存储额度
          retention-days: 1
          path: |
            target/${{ matrix.target }}/release/ht*
      - name: Package ht
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd target/${{ matrix.target }}/release
          zip -j ht-${{ matrix.name }}.zip ht${{ contains(matrix.target, 'windows') && '.exe' || '' }}
      - name: Publish
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.target }}/release/ht-${{ matrix.name }}.zip
          generate_release_notes: true
          draft: false

  docker:
    name: Publish to GitHub Container Registry
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is assembled from the static musl binaries that the release job
      # has already built, so nothing is compiled inside the image
      - name: Download the static musl binaries
        uses: actions/download-artifact@v4
        with:
          pattern: http-tunnel-*-linux-musl
          path: build-out
      - name: Lay out the Linux amd64 binary
        run: |
          mkdir -p build-out/amd64
          cp build-out/http-tunnel-x86_64-linux-musl/ht build-out/amd64/
      # The image is `scratch`, so a dynamically linked binary would only fail
      # at run time with an opaque exec error. Check the invariant here.
      - name: Verify the binary is static
        run: |
          file build-out/amd64/ht
          file build-out/amd64/ht | grep -Eq 'statically linked|static-pie linked'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires lowercase image names. One image carries the universal
      # binary; the role is selected by ht.toml.
      - name: Compute image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          owner="${owner,,}"
          echo "ht=ghcr.io/${owner}/ht" >> "$GITHUB_OUTPUT"
      - name: Build and push the universal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ht
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.ht }}:latest
            ${{ steps.image.outputs.ht }}:${{ github.ref_name }}
