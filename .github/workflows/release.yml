name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Cross build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: x86_64-linux-gnu
            exe: http-tunnel
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
            exe: http-tunnel
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: aarch64-linux-musl
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabi
            name: arm-linux-musleabi
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            name: arm-linux-musleabihf
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            name: armv7-linux-musleabihf
            exe: http-tunnel
            cross: true

          # The `mips*` targets are Tier 3: they have no prebuilt `std` for the
          # current stable toolchain, so `cross` fails with `can't find crate for
          # core`. They were only buildable while the toolchain happened to match
          # the one bundled in the cross image. Restore them with `build-std` on
          # nightly if mips releases are needed again.

          - os: macos-latest
            target: x86_64-apple-darwin
            name: x86_64-darwin
            exe: http-tunnel
            cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            name: aarch64-darwin
            exe: http-tunnel
            cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: x86_64-windows
            exe: http-tunnel.exe
            cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Native build
      - name: Install target
        if: matrix.cross == false
        run: rustup target add ${{ matrix.target }}
      - name: Run tests
        if: matrix.cross == false && matrix.target != 'aarch64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }} --verbose
      - name: Build release
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }}

      # Cross build
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Run tests
        if: matrix.cross
        run: cross test --release --target ${{ matrix.target }} --verbose --no-default-features --features server,client,client-api
      - name: Build release
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --no-default-features --features server,client,client-api

      - name: Run UPX
        # Upx may not support some platforms. Ignore the errors
        continue-on-error: true
        # Disable upx for mips. See https://github.com/upx/upx/issues/387
        if: matrix.os == 'ubuntu-latest' && !contains(matrix.target, 'mips')
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v4.0.2
          files: target/${{ matrix.target }}/release/${{ matrix.exe }}
          args: -q --best --lzma
      - uses: actions/upload-artifact@v4
        with:
          name: http-tunnel-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
      - name: Zip Release
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: http-tunnel-${{ matrix.name }}.zip
          directory: target/${{ matrix.target }}/release/
          path: ${{ matrix.exe }}
      - name: Publish
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/${{ matrix.target }}/release/http-tunnel-${{ matrix.name }}.zip
          generate_release_notes: true
          draft: true

  android:
    name: Build the Android client
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The shared library is built with the Rust toolchain and the NDK, and the
      # APK with the Android SDK and Gradle
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up the Android SDK and the NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.1.10909125"

      - name: Build the shared library for every ABI
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        # `bash` explicitly: the executable bit isn't tracked on Windows
        run: bash ./android/build.sh

      # The wrapper isn't committed, so it is generated with the pinned version
      - name: Generate the Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Build the APK
        working-directory: android
        # Debug, because a release APK would be unsigned without a keystore
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename the APK
        run: |
          mkdir -p android-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            android-apk/http-tunnel-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: http-tunnel-android
          path: android-apk/http-tunnel-android.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android-apk/http-tunnel-android.apk
          draft: true

  docker:
    name: Publish to GitHub Container Registry
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is assembled from the static musl binaries that the release job
      # has already built, so nothing is compiled inside the image
      - name: Download the static musl binaries
        uses: actions/download-artifact@v4
        with:
          pattern: http-tunnel-*-linux-musl
          path: build-out
      - name: Lay out the binaries by architecture
        run: |
          mkdir -p build-out/amd64 build-out/arm64
          cp build-out/http-tunnel-x86_64-linux-musl/http-tunnel build-out/amd64/
          cp build-out/http-tunnel-aarch64-linux-musl/http-tunnel build-out/arm64/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires a lowercase image name
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
