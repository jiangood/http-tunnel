name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Cross build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: http-tunnel
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: http-tunnel
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabi
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: mips-unknown-linux-gnu
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: mips-unknown-linux-musl
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: mipsel-unknown-linux-gnu
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: mipsel-unknown-linux-musl
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: mips64-unknown-linux-gnuabi64
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: mips64el-unknown-linux-gnuabi64
            exe: http-tunnel
            cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            exe: http-tunnel
            cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            exe: http-tunnel
            cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: http-tunnel.exe
            cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.71.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Native build
      - name: Install target
        if: matrix.cross == false
        run: rustup target add ${{ matrix.target }}
      - name: Run tests
        if: matrix.cross == false && matrix.target != 'aarch64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }} --verbose
      - name: Build release
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }}

      # Cross build
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Run tests
        if: matrix.cross
        run: cross test --release --target ${{ matrix.target }} --verbose --no-default-features --features server,client
      - name: Build release
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --no-default-features --features server,client

      - name: Run UPX
        # Upx may not support some platforms. Ignore the errors
        continue-on-error: true
        # Disable upx for mips. See https://github.com/upx/upx/issues/387
        if: matrix.os == 'ubuntu-latest' && !contains(matrix.target, 'mips')
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v4.0.2
          files: target/${{ matrix.target }}/release/${{ matrix.exe }}
          args: -q --best --lzma
      - uses: actions/upload-artifact@v4
        with:
          name: http-tunnel-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
      - name: Zip Release
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: http-tunnel-${{ matrix.target }}.zip
          directory: target/${{ matrix.target }}/release/
          path: ${{ matrix.exe }}
      - name: Publish
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/${{ matrix.target }}/release/http-tunnel-${{ matrix.target }}.zip
          generate_release_notes: true
          draft: true
  docker:
    name: Publish to GitHub Container Registry
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires a lowercase image name
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
