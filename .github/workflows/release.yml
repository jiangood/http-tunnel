name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Cross build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: x86_64-linux-gnu
            exe: http-tunnel
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
            exe: http-tunnel
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: aarch64-linux-musl
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabi
            name: arm-linux-musleabi
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            name: arm-linux-musleabihf
            exe: http-tunnel
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            name: armv7-linux-musleabihf
            exe: http-tunnel
            cross: true

          # The `mips*` targets are Tier 3: they have no prebuilt `std` for the
          # current stable toolchain, so `cross` fails with `can't find crate for
          # core`. They were only buildable while the toolchain happened to match
          # the one bundled in the cross image. Restore them with `build-std` on
          # nightly if mips releases are needed again.

          - os: macos-latest
            target: x86_64-apple-darwin
            name: x86_64-darwin
            exe: http-tunnel
            cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            name: aarch64-darwin
            exe: http-tunnel
            cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: x86_64-windows
            exe: http-tunnel.exe
            cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Native build
      - name: Install target
        if: matrix.cross == false
        run: rustup target add ${{ matrix.target }}
      - name: Run tests
        if: matrix.cross == false && matrix.target != 'aarch64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }} --verbose
      - name: Build release
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }}

      # Cross build
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Run tests
        if: matrix.cross
        run: cross test --release --target ${{ matrix.target }} --verbose --no-default-features --features server,client,client-api
      - name: Build release
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --no-default-features --features server,client,client-api

      - name: Run UPX
        # Upx may not support some platforms. Ignore the errors
        continue-on-error: true
        # Disable upx for mips. See https://github.com/upx/upx/issues/387
        if: matrix.os == 'ubuntu-latest' && !contains(matrix.target, 'mips')
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v4.0.2
          files: target/${{ matrix.target }}/release/${{ matrix.exe }}
          args: -q --best --lzma
      - uses: actions/upload-artifact@v4
        with:
          name: http-tunnel-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/http-tunnel*
            target/${{ matrix.target }}/release/hts*
            target/${{ matrix.target }}/release/htc*
      - name: Zip Release
        uses: TheDoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: http-tunnel-${{ matrix.name }}.zip
          directory: target/${{ matrix.target }}/release/
          path: ${{ matrix.exe }}
      - name: Package hts and htc
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd target/${{ matrix.target }}/release
          zip -j hts-${{ matrix.name }}.zip hts${{ matrix.exe == 'http-tunnel.exe' && '.exe' || '' }}
          zip -j htc-${{ matrix.name }}.zip htc${{ matrix.exe == 'http-tunnel.exe' && '.exe' || '' }}
      - name: Publish
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.target }}/release/http-tunnel-${{ matrix.name }}.zip
            target/${{ matrix.target }}/release/hts-${{ matrix.name }}.zip
            target/${{ matrix.target }}/release/htc-${{ matrix.name }}.zip
          generate_release_notes: true
          draft: true

  docker:
    name: Publish to GitHub Container Registry
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is assembled from the static musl binaries that the release job
      # has already built, so nothing is compiled inside the image
      - name: Download the static musl binaries
        uses: actions/download-artifact@v4
        with:
          pattern: http-tunnel-*-linux-musl
          path: build-out
      - name: Lay out the binaries by architecture
        run: |
          mkdir -p build-out/amd64 build-out/arm64
          cp build-out/http-tunnel-x86_64-linux-musl/hts build-out/amd64/
          cp build-out/http-tunnel-x86_64-linux-musl/htc build-out/amd64/
          cp build-out/http-tunnel-aarch64-linux-musl/hts build-out/arm64/
          cp build-out/http-tunnel-aarch64-linux-musl/htc build-out/arm64/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires lowercase image names. Publish separate role-specific images.
      - name: Compute image names
        id: image
        run: |
          echo "server=ghcr.io/${GITHUB_REPOSITORY%/*}/hts" >> "$GITHUB_OUTPUT"
          echo "client=ghcr.io/${GITHUB_REPOSITORY%/*}/htc" >> "$GITHUB_OUTPUT"
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: server
          push: true
          platforms: linux/amd64, linux/arm64
          tags: |
            ${{ steps.image.outputs.server }}:latest
            ${{ steps.image.outputs.server }}:${{ github.ref_name }}
      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: client
          push: true
          platforms: linux/amd64, linux/arm64
          tags: |
            ${{ steps.image.outputs.client }}:latest
            ${{ steps.image.outputs.client }}:${{ github.ref_name }}
