name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Cross build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Currently only publish Linux x86_64 (amd64), using musl for static binaries.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
            cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Native build
      - name: Install target
        if: matrix.cross == false
        run: rustup target add ${{ matrix.target }}
      - name: Run tests
        if: matrix.cross == false && matrix.target != 'aarch64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }} --verbose
      - name: Build release
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }}

      # Cross build
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Run tests
        if: matrix.cross
        run: cross test --release --target ${{ matrix.target }} --verbose --no-default-features --features server,client,client-api
      - name: Build release
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --no-default-features --features server,client,client-api

      - uses: actions/upload-artifact@v4
        with:
          name: http-tunnel-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/hts*
            target/${{ matrix.target }}/release/htc*
      - name: Package hts and htc
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd target/${{ matrix.target }}/release
          zip -j hts-${{ matrix.name }}.zip hts${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          zip -j htc-${{ matrix.name }}.zip htc${{ contains(matrix.target, 'windows') && '.exe' || '' }}
      - name: Publish
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.target }}/release/hts-${{ matrix.name }}.zip
            target/${{ matrix.target }}/release/htc-${{ matrix.name }}.zip
          generate_release_notes: true
          draft: false

  docker:
    name: Publish to GitHub Container Registry
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is assembled from the static musl binaries that the release job
      # has already built, so nothing is compiled inside the image
      - name: Download the static musl binaries
        uses: actions/download-artifact@v4
        with:
          pattern: http-tunnel-*-linux-musl
          path: build-out
      - name: Lay out the Linux amd64 binaries
        run: |
          mkdir -p build-out/amd64
          cp build-out/http-tunnel-x86_64-linux-musl/hts build-out/amd64/
          cp build-out/http-tunnel-x86_64-linux-musl/htc build-out/amd64/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires lowercase image names. Publish separate role-specific images.
      - name: Compute image names
        id: image
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          owner="${owner,,}"
          echo "server=ghcr.io/${owner}/hts" >> "$GITHUB_OUTPUT"
          echo "client=ghcr.io/${owner}/htc" >> "$GITHUB_OUTPUT"
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: server
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.server }}:latest
            ${{ steps.image.outputs.server }}:${{ github.ref_name }}
      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: client
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.client }}:latest
            ${{ steps.image.outputs.client }}:${{ github.ref_name }}
