name: ht-client-docker-sock

services:
  ht:
    image: ghcr.io/jiangood/ht:latest
    restart: unless-stopped
    stop_grace_period: 40s
    volumes:
      - ./data:/app
      # Docker API 等价于宿主机 root，只把 socket 交给可信的 ht 实例。
      - /var/run/docker.sock:/var/run/docker.sock
    # 只连上游时不写 [server]，不需要映射任何端口。
