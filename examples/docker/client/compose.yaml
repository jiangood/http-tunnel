name: ht-client

services:
  ht:
    image: ghcr.io/jiangood/ht:latest
    restart: unless-stopped
    # ht drains in-flight visitors for up to 30 s; Docker's default 10 s is too short.
    stop_grace_period: 40s
    volumes:
      - ./data:/app
    # Linux Docker Engine 上访问宿主机服务时需要这一行；Docker Desktop 已内置。
    extra_hosts:
      - "host.docker.internal:host-gateway"
