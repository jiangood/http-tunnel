name: ht-server

services:
  ht:
    image: ghcr.io/jiangood/ht:latest
    restart: unless-stopped
    # ht drains in-flight visitors for up to 30 s; Docker's default 10 s is too short.
    stop_grace_period: 40s
    ports:
      # 放在 Nginx/Caddy 后面时改成 "127.0.0.1:7777:7777"。
      - "7777:7777"
    volumes:
      # 挂载整个目录，管理页保存配置时才能原子回写 ht.toml。
      - ./data:/app
