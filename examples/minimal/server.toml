server_port = 2333 # The port that the server listens for clients
http_port = 80 # The HTTP entrypoint, routed by the `Host` header

[clients.home] # The name must be identical to the `--name` of the client
token = "123" # The token of the client

[clients.home.tunnels]
"foo1.example.com" = "127.0.0.1:80" # Requests with this `Host` are forwarded to this address
