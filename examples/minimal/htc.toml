## http-tunnel client configuration
##
## Set these values, then start htc.
## Every setting also has an HTC_* environment counterpart (HTC_SERVER,
## HTC_NAME, HTC_TOKEN, HTC_TUNNELS, ...) that wins over this file.
## `server` is the WebSocket endpoint of the server: its host must be the
## `server_host` of hts.toml and its port the server's `server_port`.
## `wss` (TLS) defaults to port 443; use `ws` only on a trusted network.
server = "wss://control.example.com:443"
name = "home"
token = "replace-with-the-same-secret-as-hts"
web_port = 8610
## Optional: the address the web management page and API bind. It defaults to
## `0.0.0.0`; set it to `127.0.0.1` to keep it on this machine.
# web_host = "127.0.0.1"

## Add one [[tunnels]] block per service to expose and remove the leading #.
# [[tunnels]]
# name = "nas"
# domain = "nas.example.com"
# local_addr = "127.0.0.1:80"
