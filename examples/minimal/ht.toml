## ht 配置文件
##
## 首次启动自动生成：默认服务端模式，监听 0.0.0.0:7777，token 随机生成。
## 客户端模式：删除 [server]，再取消 [upstream] 的注释。
## 中继模式：同时保留 [server] 和取消注释的 [upstream]。

name = "edge"

## 服务端模式（默认启用）。
## bind 0.0.0.0 便于 Docker 和公网直连，但会暴露到所有可达网络；
## 仅本机反代时改 127.0.0.1，公网务必配强 token 和防火墙。
## domain 是入口 Host；启用后 token 保护管理页/API 和 v4 入口，
## token 首次生成时随机写入，下游节点需使用相同值。
[server]
port = 7777
bind = "0.0.0.0"
# domain = "edge.lan"
# token = "replace-with-the-downstream-secret"
# keepalive_interval = 15
# max_pending_handshakes = 256
# max_sessions = 256

## 客户端/中继模式：取消注释并填写上一跳。
## 没有 [server] 时，本进程的本地服务由 v4 流直接连接，不占监听端口。
# [upstream]
# url = "wss://control.example.com:443"
# token = "replace-with-the-upstream-secret"
##
## 是否允许上一跳通过 v4 管理通道修改本节点 [[proxies]]，默认 false。
# allow_modify = false
##
## 重连上一跳的间隔（秒）与上游 WebSocket 保活间隔（秒）；0 关闭保活。
# retry_interval = 1
# keepalive_interval = 15

## 本进程直接服务的本地服务。
## bind 0.0.0.0 时这些域名对外可达，公网使用前请确认或删除示例。
[[proxies]]
name = "nas"
domain = "nas.example.com"
local_addr = "127.0.0.1:80"
