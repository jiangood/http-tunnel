## The configuration of a client.
##
## The server takes no configuration file: it is started with `--server-port`,
## `--http-port` and `--token`. The tunnels are declared here, on the client.
##
## The identity (`remote`, `name` and `token`) can also be passed on the command
## line or through the environment, in which case the command line wins.
remote = "myserver.example.com:2333"
name = "home_nas"
token = "use_a_secret_that_only_you_know"

[[tunnels]]
## The name identifies the tunnel within the client and is required.
## The domain is the `Host` the tunnel serves.
name = "nas"
domain = "nas.example.com"
local_addr = "127.0.0.1:80"
