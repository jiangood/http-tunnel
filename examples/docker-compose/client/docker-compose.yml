# Docker Compose example for the client.
#
# The client takes no configuration file: the address of the server, the name
# of the client and its token are passed through the `HTTP_TUNNEL_REMOTE`,
# `HTTP_TUNNEL_NAME` and `HTTP_TUNNEL_TOKEN` environment variables. The name
# must match a `[clients.<name>]` key in `server.toml`.
#
# The default bridge network is enough. A tunnel that reaches a service on the
# host uses `host.docker.internal` as its `local_addr` in `server.toml` (on
# Linux, uncomment `extra_hosts` below), or the name of another container on
# the same network.
services:
  http-tunnel:
    image: ghcr.io/jiangood/http-tunnel:latest
    container_name: http-tunnel
    restart: unless-stopped
    command: client
    # The client administration API listens on 8610. Drop the mapping if it's
    # not needed, or change the port with `HTTP_TUNNEL_API_PORT`.
    ports:
      - "8610:8610"
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment:
      - HTTP_TUNNEL_REMOTE=myserver.com:2333
      - HTTP_TUNNEL_NAME=home_nas
      # Keeps the token out of the container's arguments, so it doesn't show
      # up in `ps`. Set it in a `.env` file next to this file instead of
      # hardcoding it here.
      - HTTP_TUNNEL_TOKEN=use_a_secret_that_only_you_know
