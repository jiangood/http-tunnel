<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>http-tunnel admin</title>
<style>
  /* Minimal; tabs use the native hidden attribute. */
  body { font-size: .9rem; margin: 1rem; max-width: 62rem; }
  input, select, button { font-size: inherit; }
  fieldset { border: 1px solid #bbb; padding: .4rem .6rem; margin: 0 0 .6rem; }
  legend { padding: 0 .3rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: .15rem .35rem; text-align: left; }
  th { background: #f3f3f3; }
  .tabs button { margin-right: .25rem; }
  .tabs button[aria-selected="true"] { font-weight: bold; }
  .hint { color: #777; }
  .err { color: #c00; white-space: pre-wrap; }
  .ok { color: #070; }
  code { font-size: .85em; }
</style>
</head>
<body>

<div>
  <b>http-tunnel <span class="hint">admin</span></b>
  <span id="status" class="hint"></span>
</div>

<p>
  <input id="token" type="password" placeholder="api_token" autocomplete="off">
  <button type="button" onclick="saveToken()">Save</button>
  <button type="button" onclick="refresh()">Refresh</button>
</p>

<div id="error" class="err"></div>

<div class="tabs">
  <button type="button" aria-selected="true" onclick="showTab('clients', this)">Clients</button>
  <button type="button" aria-selected="false" onclick="showTab('create', this)">Create client</button>
  <button type="button" aria-selected="false" onclick="showTab('tunnel', this)">Add / update tunnel</button>
</div>

<section id="tab-clients">
  <div id="clients"></div>
</section>

<section id="tab-create" hidden>
  <form id="create-client" onsubmit="return onCreateClient(event)">
    <fieldset>
      <legend>Create client</legend>
      <p><label for="c-name" style="display:inline-block;min-width:9rem">Name</label><input id="c-name" type="text" required></p>
      <p><label for="c-token" style="display:inline-block;min-width:9rem">Token</label><input id="c-token" type="text" required></p>
      <p><label for="c-hbi" style="display:inline-block;min-width:9rem">Heartbeat interval</label><input id="c-hbi" type="text" placeholder="optional"></p>
      <p><label for="c-hb" style="display:inline-block;min-width:9rem">Heartbeat timeout</label><input id="c-hb" type="text" placeholder="optional"></p>
      <p><label for="c-retry" style="display:inline-block;min-width:9rem">Retry interval</label><input id="c-retry" type="text" placeholder="optional"></p>
      <p><label for="c-nodelay" style="display:inline-block;min-width:9rem">Nodelay</label>
        <select id="c-nodelay"><option value="">inherit</option><option value="true">true</option><option value="false">false</option></select>
      </p>
      <p><button type="submit">Create</button></p>
    </fieldset>
  </form>
</section>

<section id="tab-tunnel" hidden>
  <form id="put-tunnel" onsubmit="return onPutTunnel(event)">
    <fieldset>
      <legend>Add / update tunnel</legend>
      <p><label for="t-client" style="display:inline-block;min-width:9rem">Client</label><input id="t-client" type="text" required></p>
      <p><label for="t-domain" style="display:inline-block;min-width:9rem">Domain</label><input id="t-domain" type="text" placeholder="foo.example.com" required></p>
      <p><label for="t-local" style="display:inline-block;min-width:9rem">Local addr</label><input id="t-local" type="text" placeholder="127.0.0.1:80" required></p>
      <p><button type="submit">Save</button></p>
    </fieldset>
  </form>
</section>

<script>
const $ = (id) => document.getElementById(id);

function showTab(id, btn) {
  ["clients", "create", "tunnel"].forEach((t) => { $("tab-" + t).hidden = t !== id; });
  const tabs = btn.parentNode.querySelectorAll("button");
  for (const b of tabs) b.setAttribute("aria-selected", String(b === btn));
}

function token() { return $("token").value.trim(); }
function saveToken() { localStorage.setItem("http_tunnel_token", token()); setStatus("Token saved"); }
function setStatus(text, ok) { const s = $("status"); s.textContent = text; s.className = ok ? "ok" : "hint"; }
function setError(text) { $("error").textContent = text || ""; }

async function api(path, options = {}) {
  const res = await fetch("/api" + path, {
    ...options,
    headers: { "Authorization": "Bearer " + token(), "Content-Type": "application/json", ...(options.headers || {}) },
  });
  if (res.status === 204) return null;
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!res.ok) throw new Error((body && body.error) || (body || res.statusText));
  return body;
}

function optionalNumber(id) {
  const v = $(id).value.trim();
  if (v === "") return undefined;
  const n = Number(v);
  if (!Number.isFinite(n)) throw new Error(id + " must be a number");
  return n;
}
function optionalBool(id) {
  const v = $(id).value;
  return v === "" ? undefined : v === "true";
}

async function refresh() {
  setError("");
  try {
    const status = await api("/status");
    $("status").textContent = status.clients + " client(s), " + status.tunnels + " tunnel(s)";
    const clients = await api("/clients");
    renderClients(clients);
  } catch (e) { setError(String(e.message || e)); }
}

function renderClients(clients) {
  const root = $("clients");
  if (!clients.length) { root.innerHTML = '<p class="hint">No client yet.</p>'; return; }
  let html = "";
  for (const c of clients) {
    html += "<fieldset>";
    html += "<legend><b>" + esc(c.name) + "</b> <code>" + esc(c.token) + "</code></legend>";
    html += '<table><thead><tr><th>Domain</th><th>Local addr</th><th></th></tr></thead><tbody>';
    for (const t of c.tunnels) {
      html += "<tr><td>" + esc(t.domain) + "</td><td>" + esc(t.local_addr) + "</td>" +
        '<td><button type="button" onclick="delTunnel(\'' + js(c.name) + "','" + js(t.domain) + "')\">delete</button></td></tr>";
    }
    if (!c.tunnels.length) html += '<tr><td colspan="3" class="hint">No tunnel</td></tr>';
    html += "</tbody></table>";
    html += '<p><button type="button" onclick="delClient(\'' + js(c.name) + "')\">Delete client</button></p>";
    html += "</fieldset>";
  }
  root.innerHTML = html;
}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function js(s) { return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

async function onCreateClient(e) {
  e.preventDefault(); setError("");
  try {
    await api("/clients", { method: "POST", body: JSON.stringify({
      name: $("c-name").value.trim(), token: $("c-token").value.trim(),
      heartbeat_interval: optionalNumber("c-hbi"), heartbeat_timeout: optionalNumber("c-hb"), retry_interval: optionalNumber("c-retry"), nodelay: optionalBool("c-nodelay"),
    })});
    e.target.reset();
    setStatus("Client created", true);
    refresh();
  } catch (err) { setError(String(err.message || err)); }
  return false;
}

async function onPutTunnel(e) {
  e.preventDefault(); setError("");
  try {
    const client = $("t-client").value.trim(), domain = $("t-domain").value.trim();
    await api("/clients/" + encodeURIComponent(client) + "/tunnels/" + encodeURIComponent(domain), {
      method: "PUT", body: JSON.stringify({ local_addr: $("t-local").value.trim() }),
    });
    e.target.reset();
    setStatus("Tunnel saved", true);
    refresh();
  } catch (err) { setError(String(err.message || err)); }
  return false;
}

async function delTunnel(client, domain) {
  if (!confirm("Delete tunnel " + domain + " of " + client + "?")) return;
  setError("");
  try {
    await api("/clients/" + encodeURIComponent(client) + "/tunnels/" + encodeURIComponent(domain), { method: "DELETE" });
    setStatus("Tunnel deleted", true); refresh();
  } catch (e) { setError(String(e.message || e)); }
}

async function delClient(client) {
  if (!confirm("Delete client " + client + " and all its tunnels?")) return;
  setError("");
  try {
    await api("/clients/" + encodeURIComponent(client), { method: "DELETE" });
    setStatus("Client deleted", true); refresh();
  } catch (e) { setError(String(e.message || e)); }
}

$("token").value = localStorage.getItem("http_tunnel_token") || "";
if (token()) refresh();
</script>
</body>
</html>
