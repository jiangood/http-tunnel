<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>http-tunnel admin</title>
<link id="pico" rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/picocss/2.1.1/pico.min.css">
<script>
  // Load Pico.css from the first reachable CDN. The primary is a CDN that is
  // reachable from mainland China; the rest are fallbacks.
  (function () {
    var urls = [
      "https://cdn.bootcdn.net/ajax/libs/picocss/2.1.1/pico.min.css",
      "https://lib.baomitu.com/picocss/2.1.1/pico.min.css",
      "https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
    ];
    var i = 0, link = document.getElementById("pico");
    function advance() { if (++i < urls.length) link.href = urls[i]; }
    link.addEventListener("error", advance);
    // The probe catches a request that hangs and only fails after `load`.
    window.addEventListener("load", function () {
      var ok = getComputedStyle(document.documentElement)
        .getPropertyValue("--pico-font-size");
      if (!ok) advance();
    });
  })();
</script>
<style>
  /* Only what Pico doesn't cover. */
  .muted { opacity: .7; font-size: .85rem; }
  .error { color: var(--pico-del-color, #c0392b); margin-top: .5rem; white-space: pre-wrap; }
  .ok { color: var(--pico-ins-color, #27ae60); }
  button.danger {
    --pico-background-color: transparent;
    --pico-border-color: var(--pico-del-color, #c0392b);
    --pico-color: var(--pico-del-color, #c0392b);
  }
  button.danger:hover, button.danger:focus {
    --pico-background-color: var(--pico-del-color, #c0392b);
    --pico-color: #fff;
  }
  .client { border-top: 1px solid var(--pico-muted-border-color, #8884); padding-top: 1rem; margin-top: 1rem; }
  .client h3 { margin-bottom: .25rem; }
</style>
</head>
<body>
<main class="container">
<h1>http-tunnel <span class="muted">admin</span></h1>

<div role="group">
  <input id="token" type="password" placeholder="api_token" autocomplete="off">
  <button class="secondary" onclick="saveToken()">Save</button>
  <button class="outline" onclick="refresh()">Refresh</button>
</div>
<span id="status" class="muted"></span>
<div id="error" class="error"></div>

<h2>Clients</h2>
<div id="clients"></div>

<h2>Create client</h2>
<form id="create-client" onsubmit="return onCreateClient(event)">
  <label for="c-name">Name</label>
  <input id="c-name" type="text" required>
  <label for="c-token">Token</label>
  <input id="c-token" type="text" required>
  <label for="c-hbi">Heartbeat interval</label>
  <input id="c-hbi" type="text" placeholder="optional">
  <label for="c-hb">Heartbeat timeout</label>
  <input id="c-hb" type="text" placeholder="optional">
  <label for="c-retry">Retry interval</label>
  <input id="c-retry" type="text" placeholder="optional">
  <label for="c-nodelay">Nodelay</label>
  <select id="c-nodelay"><option value="">inherit</option><option value="true">true</option><option value="false">false</option></select>
  <button type="submit">Create</button>
</form>

<h2>Add / update tunnel</h2>
<form id="put-tunnel" onsubmit="return onPutTunnel(event)">
  <label for="t-client">Client</label>
  <input id="t-client" type="text" required>
  <label for="t-domain">Domain</label>
  <input id="t-domain" type="text" placeholder="foo.example.com" required>
  <label for="t-local">Local addr</label>
  <input id="t-local" type="text" placeholder="127.0.0.1:80" required>
  <button type="submit">Save</button>
</form>
</main>

<script>
const $ = (id) => document.getElementById(id);

function token() { return $("token").value.trim(); }
function saveToken() { localStorage.setItem("http_tunnel_token", token()); setStatus("Token saved"); }
function setStatus(text, ok) { const s = $("status"); s.textContent = text; s.className = ok ? "ok" : "muted"; }
function setError(text) { $("error").textContent = text || ""; }

async function api(path, options = {}) {
  const res = await fetch("/api" + path, {
    ...options,
    headers: { "Authorization": "Bearer " + token(), "Content-Type": "application/json", ...(options.headers || {}) },
  });
  if (res.status === 204) return null;
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!res.ok) throw new Error((body && body.error) || (body || res.statusText));
  return body;
}

function optionalNumber(id) {
  const v = $(id).value.trim();
  if (v === "") return undefined;
  const n = Number(v);
  if (!Number.isFinite(n)) throw new Error(id + " must be a number");
  return n;
}
function optionalBool(id) {
  const v = $(id).value;
  return v === "" ? undefined : v === "true";
}

async function refresh() {
  setError("");
  try {
    const status = await api("/status");
    $("status").textContent = status.clients + " client(s), " + status.tunnels + " tunnel(s)";
    const clients = await api("/clients");
    renderClients(clients);
  } catch (e) { setError(String(e.message || e)); }
}

function renderClients(clients) {
  const root = $("clients");
  if (!clients.length) { root.innerHTML = '<p class="muted">No client yet.</p>'; return; }
  let html = "";
  for (const c of clients) {
    html += '<section class="client">';
    html += "<h3>" + esc(c.name) + " <span class=\"muted\">token " + esc(c.token) + "</span></h3>";
    html += "<table><thead><tr><th>Domain</th><th>Local addr</th><th></th></tr></thead><tbody>";
    for (const t of c.tunnels) {
      html += "<tr><td>" + esc(t.domain) + "</td><td>" + esc(t.local_addr) +
        "</td>" +
        '<td><button class="danger" onclick="delTunnel(\'' + js(c.name) + "','" + js(t.domain) + "')\">delete</button></td></tr>";
    }
    if (!c.tunnels.length) html += '<tr><td colspan="3" class="muted">No tunnel</td></tr>';
    html += "</tbody></table>";
    html += '<button class="danger" onclick="delClient(\'' + js(c.name) + "')\">Delete client " + esc(c.name) + "</button>";
    html += "</section>";
  }
  root.innerHTML = html;
}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function js(s) { return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

async function onCreateClient(e) {
  e.preventDefault(); setError("");
  try {
    await api("/clients", { method: "POST", body: JSON.stringify({
      name: $("c-name").value.trim(), token: $("c-token").value.trim(),
      heartbeat_interval: optionalNumber("c-hbi"), heartbeat_timeout: optionalNumber("c-hb"), retry_interval: optionalNumber("c-retry"), nodelay: optionalBool("c-nodelay"),
    })});
    e.target.reset();
    setStatus("Client created", true);
    refresh();
  } catch (err) { setError(String(err.message || err)); }
  return false;
}

async function onPutTunnel(e) {
  e.preventDefault(); setError("");
  try {
    const client = $("t-client").value.trim(), domain = $("t-domain").value.trim();
    await api("/clients/" + encodeURIComponent(client) + "/tunnels/" + encodeURIComponent(domain), {
      method: "PUT", body: JSON.stringify({ local_addr: $("t-local").value.trim() }),
    });
    e.target.reset();
    setStatus("Tunnel saved", true);
    refresh();
  } catch (err) { setError(String(err.message || err)); }
  return false;
}

async function delTunnel(client, domain) {
  if (!confirm("Delete tunnel " + domain + " of " + client + "?")) return;
  setError("");
  try {
    await api("/clients/" + encodeURIComponent(client) + "/tunnels/" + encodeURIComponent(domain), { method: "DELETE" });
    setStatus("Tunnel deleted", true); refresh();
  } catch (e) { setError(String(e.message || e)); }
}

async function delClient(client) {
  if (!confirm("Delete client " + client + " and all its tunnels?")) return;
  setError("");
  try {
    await api("/clients/" + encodeURIComponent(client), { method: "DELETE" });
    setStatus("Client deleted", true); refresh();
  } catch (e) { setError(String(e.message || e)); }
}

$("token").value = localStorage.getItem("http_tunnel_token") || "";
if (token()) refresh();
</script>
</body>
</html>
