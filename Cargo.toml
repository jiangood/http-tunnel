[package]
autobins = false
name = "http-tunnel"
version = "2.2.0"
edition = "2021"
authors = ["Yujia Qiao <code@rapiz.me>", "jiangood"]
description = "A secure, stable and high-performance HTTP reverse proxy for NAT traversal"
license = "Apache-2.0"
repository = "https://github.com/jiangood/http-tunnel"
readme = "README.md"
build = "build.rs"
include = ["src/**/*", "examples/**/*", "LICENSE", "README.md", "build.rs"]

[lib]
name = "http_tunnel"
path = "src/lib.rs"

[[bin]]
name = "ht"
path = "src/bin/ht.rs"
required-features = ["node"]

# The benchmarks of the HTTP path. They are plain `harness = false` binaries, so
# that no benchmarking crate is pulled in (see `benches/`).
[[bench]]
name = "throughput"
harness = false

[features]
default = [
    "server",
    "client",
    "management",
    "node",
]

# Run as a server
server = []
# Run as a client
client = []
# Run as a node (a server that also dials one upstream hop)
node = ["server", "client"]
# The web management page and administration API. Kept out of `server` so that a
# minimal build doesn't pull in an HTTP server
management = ["dep:axum", "dep:hyper"]

# Feature to enable tokio-console. Disabled by default.
# Don't enable it unless for debugging purposes.
console = ["console-subscriber", "tokio/tracing"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[profile.bench]
debug = 1

[profile.minimal]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "3.0", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.10"
bincode = "1"
rand = "0.8"
backoff = { version = "0.4", features = ["tokio"] }
futures-util = "0.3"
# `rustls-tls-webpki-roots` lets the client reach a `wss://` endpoint. The roots
# are compiled in, so the static musl image needs no system trust store.
tokio-tungstenite = { version = "0.20", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.6", optional = true }
# Serves the management router on the existing `listen_port` connection. It must
# match the hyper version axum 0.6 uses, so that the `Router` implements the
# `Service` the connection expects.
hyper = { version = "0.14", features = ["server", "http1"], optional = true }
fdlimit = "0.2"
console-subscriber = { version = "0.1", optional = true, features = [
    "parking_lot",
] }
atty = "0.2"

[build-dependencies]
# The `git` feature is deliberately left out: it pulls in libgit2, whose build
# script does not link `advapi32` on Windows with recent toolchains, which breaks
# the build there. The version is taken from `VERGEN_BUILD_SEMVER` instead.
vergen = { version = "7.4.2", default-features = false, features = [
    "build",
    "cargo",
] }
anyhow = "1.0"
