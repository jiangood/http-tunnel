[package]
name = "http-tunnel"
version = "0.9.0"
edition = "2021"
authors = ["Yujia Qiao <code@rapiz.me>", "jiangood"]
description = "A secure, stable and high-performance HTTP reverse proxy for NAT traversal"
license = "Apache-2.0"
repository = "https://github.com/jiangood/http-tunnel"
readme = "README.md"
build = "build.rs"
include = ["src/**/*", "LICENSE", "README.md", "build.rs"]

[lib]
# A plain `lib`. The JNI shared library of the Android client is a separate
# `cdylib` example (see `[[example]]` below).
name = "http_tunnel"
path = "src/lib.rs"

# The shared library embedded by the Android client. Reusing the crate, it only
# re-exports the C API of `src/mobile.rs`, but as its own `cdylib` target: a
# `cdylib` that is named after the package makes cargo emit an `http_tunnel.dll`
# in `deps/` that collides with the artifacts of the integration tests on
# Windows, which breaks the link of `cargo test`. It is built with the `mobile`
# feature by `android/build.sh`.
[[example]]
name = "http_tunnel_mobile"
crate-type = ["cdylib"]
path = "src/mobile_ffi.rs"
required-features = ["mobile", "client"]

# The benchmarks of the HTTP path. They are plain `harness = false` binaries, so
# that no benchmarking crate is pulled in (see `benches/`).
[[bench]]
name = "throughput"
harness = false

[features]
default = [
    "server",
    "client",
    "client-api",
]

# Run as a server
server = ["dep:axum", "dep:serde_json"]
# Run as a client
client = []
# The administration API of the client. Kept out of `client` so that a minimal
# client build (e.g. the Android cdylib) doesn't pull in an HTTP server
client-api = ["dep:axum"]

# The mobile client. It embeds the client and exposes a small C API that the
# Android UI calls through JNI
mobile = ["dep:tracing-android"]

# Feature to enable tokio-console. Disabled by default.
# Don't enable it unless for debugging purposes.
console = ["console-subscriber", "tokio/tracing"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[profile.bench]
debug = 1

[profile.minimal]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "3.0", features = ["derive", "env"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.10"
bincode = "1"
lazy_static = "1.4"
hex = "0.4"
rand = "0.8"
backoff = { version = "0.4", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.6", optional = true }
serde_json = { version = "1", optional = true }
fdlimit = "0.2"
console-subscriber = { version = "0.1", optional = true, features = [
    "parking_lot",
] }
atty = "0.2"
# The mobile client logs through `tracing`, and logcat is fed by this layer. It
# only builds for Android, so it is declared for that target (see
# `src/mobile.rs`).
[target.'cfg(target_os = "android")'.dependencies]
tracing-android = { version = "0.2", optional = true }

[build-dependencies]
# The `git` feature is deliberately left out: it pulls in libgit2, whose build
# script does not link `advapi32` on Windows with recent toolchains, which breaks
# the build there. The version is taken from `VERGEN_BUILD_SEMVER` instead.
vergen = { version = "7.4.2", default-features = false, features = [
    "build",
    "cargo",
] }
anyhow = "1.0"
